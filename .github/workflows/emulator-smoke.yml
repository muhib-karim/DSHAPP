name: Emulator smoke

# Fork (muhib-karim/DSHAPP): builds the release APKs (Release APK workflow), installs the system-WebView APK on an
# Android 14 emulator (x86_64 image with arm64 translation; the app is arm64-only), launches it and screenshots the
# first screen, the chat screen and the settings screen (artifact emulator-screenshots).
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    uses: ./.github/workflows/release-apk.yml
    secrets: inherit

  smoke:
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: dshapp-release-apks
          path: dist
      - name: Enable KVM access
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Install, launch, screenshot first screen, chat and settings
        uses: reactivecircus/android-emulator-runner@1dcd0090116d15e7c562f8db72807de5e036a4ed # v2.34.0
        with:
          api-level: 34
          target: google_apis
          arch: x86_64
          profile: pixel_6
          disk-size: 8000M
          ram-size: 4096M
          disable-animations: true
          script: python3 -I tools/ci/emulator-smoke.py "$(ls dist/DSH*-mk.apk)" com.mkdsh.droid emulator-screenshots
      - name: Upload screenshots, UI dumps and logcat
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: emulator-screenshots
          path: emulator-screenshots/
          if-no-files-found: warn
